[project]
name = "nnspike"
version = "0.1.0"
description = "A LEGO SPIKE Robot using Neural Network for line following"
readme = "README.md"
requires-python = ">=3.11.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "er-ri"}
]
keywords = ["LEGO", "SPIKE", "neural-network", "robotics", "line-follower"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "tqdm>=4.66.4",
    "albumentations>=1.3.1",
    "tensorboard>=2.17.0",
    "opencv-python>=4.8.1.78",
    "torch>=2.3.1",
    "torchaudio>=2.3.1",
    "torchvision>=0.18.1",
    "pandas>=2.2.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "numpy==1.26.4",
    "jupyterlab>=4.2.4",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "flake8-pyproject>=1.2.3",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/er-ri/nnspike"
"Bug Tracker" = "https://github.com/er-ri/nnspike/issues"

[tool.flake8]
max-line-length = 180
extend-ignore = ["E201", "E203","E402", "E712"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
]

[tool.black]
line-length = 180
target-version = ["py311", "py312"]
include = '\.py$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
)/
'''

[tool.isort]
profile = "black"
line_length = 180
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true