[project]
name = "nnspike"
version = "2025.09"
description = "A LEGO SPIKE Robot using Neural Network for line following"
readme = "README.md"
requires-python = ">=3.11.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "er-ri"}
]
keywords = ["LEGO", "SPIKE", "neural-network", "robotics", "line-follower"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "tqdm>=4.66.4",
    "albumentations>=1.3.1",
    "tensorboard>=2.17.0",
    "opencv-python>=4.8.1.78",
    "torch>=2.3.1",
    "torchaudio>=2.3.1",
    "torchvision>=0.18.1",
    "pandas>=2.2.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "numpy==1.26.4",
    "jupyterlab>=4.2.4",
    "scikit-learn>=1.7.2",
    "pyserial==3.5",
    "onnx==1.18.0",
    "onnxruntime==1.22.1",
    "onnxscript==0.4.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "ruff>=0.12.12",
    "commitizen>=3.0.0",
    # Type stubs for better mypy support
    "types-tqdm>=4.66.0",
    "pandas-stubs>=2.0.0",
    "types-requests>=2.31.0",
]
doc = [
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.2.0",
    "sphinx-rtd-theme>=3.0.2",
]

[project.urls]
"Homepage" = "https://github.com/er-ri/nnspike"
"Bug Tracker" = "https://github.com/er-ri/nnspike/issues"

[tool.ruff]
# Ruff configuration replaces flake8, black, and isort
line-length = 88
target-version = "py311"
fix = true

# Exclude directories (equivalent to flake8 exclude)
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".venv",
    ".mypy_cache",
    ".tox",
    "_build",
    "buck-out",
    "env",
    "venv",
]

[tool.ruff.lint]
# Enable specific rule categories
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules (equivalent to flake8 extend-ignore)
ignore = [
    "D100",  # missing docstring in public module
    "D101",  # missing docstring in public class
    "D102",  # missing docstring in public method
    "D103",  # missing docstring in public function
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "D417",  # requires documentation for every function parameter
    "E201",  # whitespace after '('
    "E203",  # whitespace before ':'
    "E402",  # module level import not at top of file
    "E501",  # line too long (handled by line-length)
    "E711",  # comparison to None should be 'if cond is None:'
    "E712",  # comparison to True should be 'if cond is True:'
    "F401",  # imported but unused
]

[tool.ruff.format]
# Ruff formatter replaces black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.isort]
# Ruff import sorting replaces isort
force-single-line = false
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
# Use explicit package bases to resolve module naming conflicts
explicit_package_bases = true
# Workaround for TypeGuardedType serialization issue
incremental = false
# Type checking settings
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
# Show error codes for easier debugging
show_error_codes = true
# Handle third-party libraries gracefully
ignore_missing_imports = true
follow_imports = "silent"
# Exclude common directories that shouldn't be type-checked
exclude = [
    "build/",
    "dist/",
    "docs/",
    "tests/",
    "scripts/",
    "storage/",
    "notebooks/",
    "__pycache__/",
    ".*.egg-info/",
]

[[tool.mypy.overrides]]
module = "cv2"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = "torch.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "torchvision.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

# Disable specific warnings for files using cv2
[[tool.mypy.overrides]]
module = "nnspike.utils.control"
disable_error_code = ["arg-type", "unused-ignore"]

[[tool.mypy.overrides]]
module = "nnspike.utils.image"
disable_error_code = ["call-arg", "unused-ignore"]

[[tool.mypy.overrides]]
module = [
    "pandas",
    "torch",
    "torch.*",
    "torchvision",
    "torchvision.*",
    "tqdm",
    "tqdm.*",
    "albumentations",
    "numpy",
    "numpy.*",
]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

