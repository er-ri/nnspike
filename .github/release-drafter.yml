name-template: 'v$NEXT_PATCH_VERSION'
tag-template: 'v$NEXT_PATCH_VERSION'
update-changelog: true  # This automatically updates CHANGELOG.md

template: |
  ## What's Changed

  $CHANGES

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
      - 'feat'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
  - title: '📚 Documentation'
    labels:
      - 'docs'
      - 'documentation'

change-template: '- $TITLE (#$NUMBER)'
no-changes-template: 'No significant changes.'

exclude-labels:
  - 'skip-changelog'

# Auto-categorize based on conventional commit prefixes
autolabeler:
  - label: 'feat'
    title:
      - '/^feat(\(.+\))?\!?:.+$/'
  - label: 'fix'
    title:
      - '/^fix(\(.+\))?\!?:.+$/'
  - label: 'chore'
    title:
      - '/^chore(\(.+\))?\!?:.+$/'
  - label: 'docs'
    title:
      - '/^docs(\(.+\))?\!?:.+$/'
