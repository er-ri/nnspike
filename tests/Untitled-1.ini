class ManualScenario(DefaultScenario):
    """
    キーボード入力による手動操作専用のシナリオ。
    DefaultScenarioを継承し、execute_mode_actionで手動制御用のロジックを実装する。
    """
    def __init__(self):
        super().__init__()
        self.mode = Mode.MANUAL
        self.manual_start_time = None

    def transition_mode(self, key=None):
        if self.mode == Mode.MANUAL:
            # Only accept key input in MANUAL mode
            if key == 'a':
                self.mode = Mode.MANUAL_A
                self.manual_start_time = time.time()
            elif key == 'b':
                self.mode = Mode.MANUAL_B
                self.manual_start_time = time.time()
            elif key == 'd':
                self.mode = Mode.MANUAL_D
                self.manual_start_time = time.time()
        elif self.mode == Mode.MANUAL_A:
            # Ignore all key input in MANUAL_A mode
            if time.time() - self.manual_start_time >= 1.0:
                self.mode = Mode.STOP
        elif self.mode == Mode.MANUAL_B:
            # MANUAL_Bの遷移条件が必要ならここに追加
            pass
        elif self.mode == Mode.MANUAL_D:
            # MANUAL_Dの遷移条件が必要ならここに追加
            pass
        elif self.mode == Mode.STOP:
            self.mode = Mode.MANUAL

    def execute_mode_action(self, action, key=None):
        self.transition_mode(key=key)
        if self.mode == Mode.MANUAL:
            pass
        elif self.mode == Mode.MANUAL_A:
            action.do_straight()  # MANUAL_Aモードで直進
        elif self.mode == Mode.MANUAL_B:
            action.do_obstacle_avoid_no_bottle()  # MANUAL_Bモードはボトルなし回避
            if action.is_finished():
                self.mode = Mode.STOP
                action.reset()  # 回避動作の状態もリセット
        elif self.mode == Mode.MANUAL_D:
            action.do_obstacle_avoid_with_bottle()  # MANUAL_Dモードはボトルあり回避
            if action.is_finished():
                self.mode = Mode.STOP
                action.reset()
        elif self.mode == Mode.STOP:
            action.do_stop()  # STOPモードで停止
